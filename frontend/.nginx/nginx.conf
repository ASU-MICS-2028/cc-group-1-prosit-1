# Serves the PWA and forwards /api to the backend container, so the browser
# sees one origin (no CORS, no mixed content).
server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  gzip on;
  gzip_types text/css application/javascript application/json image/svg+xml;
  gzip_min_length 1024;

  # Docker's internal DNS. The backend name is resolved per request, so nginx
  # still starts when the backend container is not up yet.
  resolver 127.0.0.11 valid=10s;

  # Load balancer health check (ADR 0026): passes through to the backend's /health, so a
  # server only gets traffic when nginx and the API are both up.
  location = /health {
    set $backend http://backend:8080;
    proxy_pass $backend;
    access_log off;
  }

  location /api/ {
    set $backend http://backend:8080;
    proxy_pass $backend;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Hashed build output never changes: cache for a year.
  location /assets/ {
    add_header Cache-Control "public, max-age=31536000, immutable";
    try_files $uri =404;
  }

  # The app shell and the service worker must always be revalidated, or users
  # get stuck on an old version.
  location = /index.html {
    add_header Cache-Control "no-cache";
  }
  location = /sw.js {
    add_header Cache-Control "no-cache";
  }

  # Single-page app: unknown paths load the shell and the router takes over.
  location / {
    try_files $uri /index.html;
  }
}
