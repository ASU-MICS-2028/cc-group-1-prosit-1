# CI — runs on every pull request into development, staging and main.
#
# Branch protection requires exactly ONE check: "CI passed".
# That job only goes green when every job below either passed or was
# legitimately skipped (e.g. no frontend code changed in this PR).
#
# Unit tests are mandatory: a PR that drops coverage below COVERAGE_MIN fails.

name: CI

on:
  pull_request:
    branches: [development, staging, main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  COVERAGE_MIN: 70
  PYTHON_VERSION: "3.12"   # only used to run pre-commit
  NODE_VERSION: "24"
  DOTNET_VERSION: "10.0.x"
  BACKEND_DIR: backend   # ASP.NET Core service
  FRONTEND_DIR: frontend # React app

jobs:
  # ---------------------------------------------------------------------------
  # Enforce the promotion flow: development -> staging -> main
  # ---------------------------------------------------------------------------
  branch-flow:
    name: Branch flow
    runs-on: ubuntu-latest
    steps:
      - name: Check source branch is allowed for this target
        env:
          BASE: ${{ github.base_ref }}
          HEAD: ${{ github.head_ref }}
        run: |
          echo "PR: $HEAD -> $BASE"
          case "$BASE" in
            development)
              # Branch naming convention (see CONTRIBUTING.md)
              pattern='^(feature|fix|hotfix|devops|docs|refactor|test|chore)/[a-z0-9]+(-[a-z0-9]+)*$'
              if [[ "$HEAD" == dependabot/* ]]; then
                echo "Dependabot branch — naming check skipped."
              elif ! [[ "$HEAD" =~ $pattern ]]; then
                echo "::error::Branch name '$HEAD' does not follow the convention <type>/<short-name>."
                echo "::error::Types: feature, fix, hotfix, devops, docs, refactor, test, chore. Lowercase words separated by hyphens, e.g. feature/farmer-signup."
                echo "Rename it with: git branch -m <new-name> && git push origin -u <new-name>  (then open a new PR)"
                exit 1
              fi ;;
            staging)
              if [ "$HEAD" != "development" ]; then
                echo "::error::Only 'development' can be merged into 'staging' (got '$HEAD')."
                exit 1
              fi ;;
            main)
              if [ "$HEAD" != "staging" ] && [[ "$HEAD" != hotfix/* ]]; then
                echo "::error::Only 'staging' or 'hotfix/*' can be merged into 'main' (got '$HEAD')."
                exit 1
              fi ;;
          esac
          echo "Branch flow OK"

  # ---------------------------------------------------------------------------
  # Same hooks developers run locally (.pre-commit-config.yaml), so skipping
  # them with --no-verify doesn't get anything past CI
  # ---------------------------------------------------------------------------
  pre-commit:
    name: Pre-commit hooks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ hashFiles('.pre-commit-config.yaml') }}
      - run: pip install pre-commit
      - name: Run hooks on all files
        # gitleaks runs in its own job below (the hook only scans staged files);
        # no-commit-to-branch only makes sense on a developer's machine;
        # eslint/prettier need node_modules and dotnet-format needs the SDK, so the
        # frontend and backend jobs run them.
        env:
          SKIP: gitleaks,no-commit-to-branch,eslint,prettier,dotnet-format
        run: pre-commit run --all-files --show-diff-on-failure --color=always

  # ---------------------------------------------------------------------------
  # Secret scan over every commit in the PR (the repo is public)
  # ---------------------------------------------------------------------------
  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz -C /usr/local/bin gitleaks
          gitleaks version
      - name: Scan PR commits
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ -n "$BASE_SHA" ]; then
            gitleaks git --redact --verbose --log-opts="${BASE_SHA}..${HEAD_SHA}"
          else
            gitleaks git --redact --verbose
          fi

  # ---------------------------------------------------------------------------
  # Work out what this PR touches, so we only run the relevant suites
  # ---------------------------------------------------------------------------
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      backend: ${{ steps.filter.outputs.backend == 'true' && steps.exists.outputs.backend == 'true' }}
      frontend: ${{ steps.filter.outputs.frontend == 'true' && steps.exists.outputs.frontend == 'true' }}
      docker: ${{ steps.filter.outputs.docker }}
    steps:
      - uses: actions/checkout@v4
      - id: exists
        run: |
          ls "$BACKEND_DIR"/*.sln >/dev/null 2>&1 && echo "backend=true" >> "$GITHUB_OUTPUT" || echo "backend=false" >> "$GITHUB_OUTPUT"
          [ -f "$FRONTEND_DIR/package.json" ] && echo "frontend=true" >> "$GITHUB_OUTPUT" || echo "frontend=false" >> "$GITHUB_OUTPUT"
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - '.github/workflows/ci.yml'
            frontend:
              - 'frontend/**'
              - '.github/workflows/ci.yml'
            docker:
              - '**/Dockerfile'
              - '**/.dockerignore'
              - 'backend/**'
              - 'frontend/**'
              - 'deploy/**'

  # ---------------------------------------------------------------------------
  # Backend: ASP.NET Core (C#) — format, build, unit tests + coverage gate
  # (the test projects reference the coverlet.msbuild package)
  # ---------------------------------------------------------------------------
  backend:
    name: Backend (format + build + unit tests)
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.BACKEND_DIR }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
      - name: Restore
        run: dotnet restore
      - name: Format check
        run: dotnet format --verify-no-changes --no-restore
      - name: Build
        run: dotnet build --no-restore -c Release
      - name: Unit tests with coverage gate
        # The build fails if line coverage is below COVERAGE_MIN.
        run: |
          dotnet test --no-restore -c Release             /p:CollectCoverage=true             /p:CoverletOutputFormat=cobertura             /p:CoverletOutput=./coverage/             /p:Threshold="${COVERAGE_MIN}"             /p:ThresholdType=line             /p:ThresholdStat=total
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: backend-coverage
          path: ${{ env.BACKEND_DIR }}/**/coverage/*.xml
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # Frontend: React — lint, format, audit, unit tests + coverage gate, build
  # ---------------------------------------------------------------------------
  frontend:
    name: Frontend (lint + unit tests + build)
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.FRONTEND_DIR }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ${{ env.FRONTEND_DIR }}/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Format check
        run: npm run format:check
      - name: Dependency audit (shipped code only)
        run: npm audit --omit=dev
      - name: Unit tests with coverage
        # The frontend must define a "test:ci" script that runs tests once
        # (no watch mode) and writes coverage/coverage-summary.json
        # (Jest/Vitest "json-summary" reporter). See CONTRIBUTING.md.
        run: npm run test:ci
      - name: Coverage gate
        run: |
          node -e '
            const fs = require("fs");
            const f = "coverage/coverage-summary.json";
            if (!fs.existsSync(f)) {
              console.error(`::error::${f} not found — test:ci must use the json-summary coverage reporter.`);
              process.exit(1);
            }
            const pct = JSON.parse(fs.readFileSync(f)).total.lines.pct;
            const min = Number(process.env.COVERAGE_MIN);
            console.log(`Line coverage: ${pct}% (minimum ${min}%)`);
            if (pct < min) {
              console.error(`::error::Frontend coverage ${pct}% is below the ${min}% minimum.`);
              process.exit(1);
            }'
      - name: Production build
        run: npm run build

  # ---------------------------------------------------------------------------
  # Docker: prove each image still builds (not pushed — deploy.yml does that)
  # ---------------------------------------------------------------------------
  docker:
    name: Docker build (${{ matrix.service }})
    needs: changes
    if: needs.changes.outputs.docker == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - id: check
        run: |
          if [ -f "${{ matrix.service }}/Dockerfile" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "No ${{ matrix.service }}/Dockerfile yet — skipping."
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/setup-buildx-action@v3
        if: steps.check.outputs.present == 'true'
      - uses: docker/build-push-action@v7
        if: steps.check.outputs.present == 'true'
        with:
          context: ${{ matrix.service }}
          push: false
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  # ---------------------------------------------------------------------------
  # The single required status check for branch protection
  # ---------------------------------------------------------------------------
  ci-passed:
    name: CI passed
    if: always()
    needs: [branch-flow, pre-commit, secrets, changes, backend, frontend, docker]
    runs-on: ubuntu-latest
    steps:
      - name: Verify every job passed or was skipped
        run: |
          echo '${{ toJSON(needs) }}' | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          if echo '${{ toJSON(needs) }}' | jq -e 'to_entries | map(.value.result) | any(. == "failure" or . == "cancelled")' > /dev/null; then
            echo "::error::One or more CI jobs failed."
            exit 1
          fi
          echo "All checks passed."
