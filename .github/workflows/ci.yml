# CI — runs on every pull request into development, staging and main.
#
# Branch protection requires exactly ONE check: "CI passed".
# That job only goes green when every job below either passed or was
# legitimately skipped (e.g. no frontend code changed in this PR).
#
# Unit tests are mandatory: a PR that drops coverage below COVERAGE_MIN fails.

name: CI

on:
  pull_request:
    branches: [development, staging, main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  COVERAGE_MIN: 70
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "20"
  BACKEND_DIR: backend   # FastAPI service
  FRONTEND_DIR: frontend # React app

jobs:
  # ---------------------------------------------------------------------------
  # Enforce the promotion flow: development -> staging -> main
  # ---------------------------------------------------------------------------
  branch-flow:
    name: Branch flow
    runs-on: ubuntu-latest
    steps:
      - name: Check source branch is allowed for this target
        env:
          BASE: ${{ github.base_ref }}
          HEAD: ${{ github.head_ref }}
        run: |
          echo "PR: $HEAD -> $BASE"
          case "$BASE" in
            staging)
              if [ "$HEAD" != "development" ]; then
                echo "::error::Only 'development' can be merged into 'staging' (got '$HEAD')."
                exit 1
              fi ;;
            main)
              if [ "$HEAD" != "staging" ] && [[ "$HEAD" != hotfix/* ]]; then
                echo "::error::Only 'staging' or 'hotfix/*' can be merged into 'main' (got '$HEAD')."
                exit 1
              fi ;;
          esac
          echo "Branch flow OK"

  # ---------------------------------------------------------------------------
  # Work out what this PR touches, so we only run the relevant suites
  # ---------------------------------------------------------------------------
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      backend: ${{ steps.filter.outputs.backend == 'true' && steps.exists.outputs.backend == 'true' }}
      frontend: ${{ steps.filter.outputs.frontend == 'true' && steps.exists.outputs.frontend == 'true' }}
      docker: ${{ steps.filter.outputs.docker }}
    steps:
      - uses: actions/checkout@v4
      - id: exists
        run: |
          [ -d "$BACKEND_DIR" ] && echo "backend=true" >> "$GITHUB_OUTPUT" || echo "backend=false" >> "$GITHUB_OUTPUT"
          [ -f "$FRONTEND_DIR/package.json" ] && echo "frontend=true" >> "$GITHUB_OUTPUT" || echo "frontend=false" >> "$GITHUB_OUTPUT"
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'backend/**'
              - '.github/workflows/ci.yml'
            frontend:
              - 'frontend/**'
              - '.github/workflows/ci.yml'
            docker:
              - '**/Dockerfile'
              - '**/.dockerignore'
              - 'backend/**'
              - 'frontend/**'
              - 'deploy/**'

  # ---------------------------------------------------------------------------
  # Backend: FastAPI — lint, format, unit tests + coverage gate
  # ---------------------------------------------------------------------------
  backend:
    name: Backend (lint + unit tests)
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.BACKEND_DIR }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            ${{ env.BACKEND_DIR }}/requirements*.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          [ -f requirements.txt ] && pip install -r requirements.txt
          [ -f requirements-dev.txt ] && pip install -r requirements-dev.txt
          pip install ruff pytest pytest-cov httpx
      - name: Lint (ruff)
        run: ruff check .
      - name: Format check (ruff format)
        run: ruff format --check .
      - name: Unit tests with coverage gate
        # pytest exits non-zero if no tests are found — so "no tests" fails CI.
        run: |
          pytest tests \
            --cov=app \
            --cov-report=term-missing \
            --cov-report=xml \
            --cov-fail-under="${COVERAGE_MIN}"
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: ${{ env.BACKEND_DIR }}/coverage.xml
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # Frontend: React — lint, unit tests + coverage gate, production build
  # ---------------------------------------------------------------------------
  frontend:
    name: Frontend (lint + unit tests + build)
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ${{ env.FRONTEND_DIR }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ${{ env.FRONTEND_DIR }}/package-lock.json
      - name: Install dependencies
        run: npm ci
      - name: Lint
        run: npm run lint
      - name: Unit tests with coverage
        # The frontend must define a "test:ci" script that runs tests once
        # (no watch mode) and writes coverage/coverage-summary.json
        # (Jest/Vitest "json-summary" reporter). See CONTRIBUTING.md.
        run: npm run test:ci
      - name: Coverage gate
        run: |
          node -e '
            const fs = require("fs");
            const f = "coverage/coverage-summary.json";
            if (!fs.existsSync(f)) {
              console.error(`::error::${f} not found — test:ci must use the json-summary coverage reporter.`);
              process.exit(1);
            }
            const pct = JSON.parse(fs.readFileSync(f)).total.lines.pct;
            const min = Number(process.env.COVERAGE_MIN);
            console.log(`Line coverage: ${pct}% (minimum ${min}%)`);
            if (pct < min) {
              console.error(`::error::Frontend coverage ${pct}% is below the ${min}% minimum.`);
              process.exit(1);
            }'
      - name: Production build
        run: npm run build

  # ---------------------------------------------------------------------------
  # Docker: prove each image still builds (not pushed — deploy.yml does that)
  # ---------------------------------------------------------------------------
  docker:
    name: Docker build (${{ matrix.service }})
    needs: changes
    if: needs.changes.outputs.docker == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - id: check
        run: |
          if [ -f "${{ matrix.service }}/Dockerfile" ]; then
            echo "present=true" >> "$GITHUB_OUTPUT"
          else
            echo "No ${{ matrix.service }}/Dockerfile yet — skipping."
            echo "present=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: docker/setup-buildx-action@v3
        if: steps.check.outputs.present == 'true'
      - uses: docker/build-push-action@v6
        if: steps.check.outputs.present == 'true'
        with:
          context: ${{ matrix.service }}
          push: false
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  # ---------------------------------------------------------------------------
  # The single required status check for branch protection
  # ---------------------------------------------------------------------------
  ci-passed:
    name: CI passed
    if: always()
    needs: [branch-flow, changes, backend, frontend, docker]
    runs-on: ubuntu-latest
    steps:
      - name: Verify every job passed or was skipped
        run: |
          echo '${{ toJSON(needs) }}' | jq -r 'to_entries[] | "\(.key): \(.value.result)"'
          if echo '${{ toJSON(needs) }}' | jq -e 'to_entries | map(.value.result) | any(. == "failure" or . == "cancelled")' > /dev/null; then
            echo "::error::One or more CI jobs failed."
            exit 1
          fi
          echo "All checks passed."
