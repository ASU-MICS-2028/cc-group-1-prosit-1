# Deploy — build images, push to GHCR, roll out to EC2.
#
#   push to staging  -> deploy to the "staging" environment (automatic)
#   push to main     -> deploy to the "production" environment
#                       (pauses for manual approval by the DevOps lead)
#   manual run       -> redeploy / roll back any environment to a given image tag
#
# No SSH and no stored AWS keys: the deploy job logs in to AWS with GitHub OIDC
# (role agroconnect-github-deploy-<env>, created by deploy/terraform) and runs
# the roll-out on the server through SSM Session Manager. Port 22 stays closed.
# The server reads its .env from SSM Parameter Store on every roll-out.

name: Deploy

on:
  push:
    branches: [staging, main]
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to deploy
        type: choice
        options: [staging, production]
        required: true
      image_tag:
        description: Image tag to deploy (e.g. sha-1a2b3c4). Leave empty to build the selected branch.
        type: string
        required: false

permissions:
  contents: read
  packages: write
  id-token: write # OIDC login to AWS

env:
  REGISTRY: ghcr.io
  APP_DIR: /opt/agroconnect
  HEALTHCHECK_URL: http://localhost:8000/health
  AWS_REGION: af-south-1
  AWS_ACCOUNT_ID: "659500703236"

jobs:
  setup:
    name: Resolve target
    runs-on: ubuntu-latest
    outputs:
      environment: ${{ steps.target.outputs.environment }}
      image_tag: ${{ steps.target.outputs.image_tag }}
      build: ${{ steps.target.outputs.build }}
      services: ${{ steps.services.outputs.list }}
      image_prefix: ${{ steps.target.outputs.image_prefix }}
    steps:
      - uses: actions/checkout@v7
      - id: target
        env:
          INPUT_ENV: ${{ inputs.environment }}
          INPUT_TAG: ${{ inputs.image_tag }}
        run: |
          if [ -n "$INPUT_ENV" ]; then
            env="$INPUT_ENV"
          elif [ "$GITHUB_REF_NAME" = "main" ]; then
            env=production
          else
            env=staging
          fi
          if [ -n "$INPUT_TAG" ]; then
            tag="$INPUT_TAG"; build=false
          else
            tag="sha-${GITHUB_SHA::7}"; build=true
          fi
          echo "environment=$env" >> "$GITHUB_OUTPUT"
          echo "image_tag=$tag"   >> "$GITHUB_OUTPUT"
          echo "build=$build"     >> "$GITHUB_OUTPUT"
          echo "image_prefix=${REGISTRY}/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"
          echo "Target: $env  Tag: $tag  Build: $build"
      - id: services
        # Only services that have a Dockerfile get built and deployed.
        run: |
          list=$(for s in backend frontend; do [ -f "$s/Dockerfile" ] && echo "\"$s\""; done | paste -sd, -)
          echo "list=[${list}]" >> "$GITHUB_OUTPUT"
          echo "Services: [${list}]"

  build:
    name: Build & push (${{ matrix.service }})
    needs: setup
    if: needs.setup.outputs.build == 'true' && needs.setup.outputs.services != '[]'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: ${{ fromJSON(needs.setup.outputs.services) }}
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.service }}
          push: true
          tags: |
            ${{ needs.setup.outputs.image_prefix }}/${{ matrix.service }}:${{ needs.setup.outputs.image_tag }}
            ${{ needs.setup.outputs.image_prefix }}/${{ matrix.service }}:${{ needs.setup.outputs.environment }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  deploy:
    name: Deploy to ${{ needs.setup.outputs.environment }}
    needs: [setup, build]
    if: |
      always() &&
      needs.setup.result == 'success' &&
      needs.setup.outputs.services != '[]' &&
      (needs.build.result == 'success' || needs.build.result == 'skipped')
    runs-on: ubuntu-latest
    environment:
      name: ${{ needs.setup.outputs.environment }}
    concurrency:
      group: deploy-${{ needs.setup.outputs.environment }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7

      - uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: arn:aws:iam::${{ env.AWS_ACCOUNT_ID }}:role/agroconnect-github-deploy-${{ needs.setup.outputs.environment }}
          aws-region: ${{ env.AWS_REGION }}

      # Servers pull from ECR with their IAM role (ADR 0026), so copy the images there.
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Copy images to ECR
        id: ecr
        env:
          IMAGE_TAG: ${{ needs.setup.outputs.image_tag }}
          IMAGE_PREFIX: ${{ needs.setup.outputs.image_prefix }}
          SERVICES: ${{ join(fromJSON(needs.setup.outputs.services), ' ') }}
        run: |
          registry="$AWS_ACCOUNT_ID.dkr.ecr.$AWS_REGION.amazonaws.com"
          aws ecr get-login-password | docker login "$registry" -u AWS --password-stdin
          for s in $SERVICES; do
            docker buildx imagetools create -t "$registry/agroconnect/$s:$IMAGE_TAG" "$IMAGE_PREFIX/$s:$IMAGE_TAG"
          done
          echo "prefix=$registry/agroconnect" >> "$GITHUB_OUTPUT"

      - name: Find the servers
        id: server
        env:
          ENVIRONMENT: ${{ needs.setup.outputs.environment }}
          IMAGE_TAG: ${{ needs.setup.outputs.image_tag }}
        # Auto Scaling runs one or more servers per environment (ADR 0026); deploy to all.
        run: |
          ids=$(aws ec2 describe-instances \
            --filters "Name=tag:Name,Values=agroconnect-$ENVIRONMENT" "Name=instance-state-name,Values=running" \
            --query 'Reservations[].Instances[].InstanceId' --output text | xargs)
          if [ -z "$ids" ] || [ "$ids" = None ]; then
            # Scaled to 0 (running = false): record the approved version; servers that
            # Auto Scaling starts later boot it (ADR 0026).
            aws ssm put-parameter --name "/agroconnect/$ENVIRONMENT/image_tag" --value "$IMAGE_TAG" \
              --type String --overwrite >/dev/null
            echo "::notice::No running agroconnect-$ENVIRONMENT servers. Recorded $IMAGE_TAG; servers will boot it when the environment is scaled up."
            echo "ids=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "ids=$ids" >> "$GITHUB_OUTPUT"
          echo "Servers: $ids"

      - name: Roll out
        if: steps.server.outputs.ids != ''
        env:
          ENVIRONMENT: ${{ needs.setup.outputs.environment }}
          INSTANCE_IDS: ${{ steps.server.outputs.ids }}
          IMAGE_TAG: ${{ needs.setup.outputs.image_tag }}
          IMAGE_PREFIX: ${{ steps.ecr.outputs.prefix }}
          SERVICES: ${{ join(fromJSON(needs.setup.outputs.services), ' ') }}
        # The script travels base64-encoded inside the SSM command. The server logs
        # in to ECR with its own IAM role; no registry token leaves this job.
        run: |
          {
            printf 'export APP_DIR=%q ENVIRONMENT=%q AWS_REGION=%q IMAGE_TAG=%q IMAGE_PREFIX=%q SERVICES=%q HEALTHCHECK_URL=%q COMPOSE_B64=%q\n' \
              "$APP_DIR" "$ENVIRONMENT" "$AWS_REGION" "$IMAGE_TAG" "$IMAGE_PREFIX" "$SERVICES" "$HEALTHCHECK_URL" \
              "$(base64 -w0 deploy/docker-compose.yml)"
            cat <<'REMOTE'
          set -euo pipefail
          cd "$APP_DIR"
          echo "$COMPOSE_B64" | base64 -d > docker-compose.yml

          # .env comes from SSM Parameter Store, read with the server's own role.
          [ -x /snap/bin/aws ] || snap install aws-cli --classic >/dev/null
          for _ in 1 2 3 4 5; do
            /snap/bin/aws ssm get-parameter --region "$AWS_REGION" --name "/agroconnect/$ENVIRONMENT/dotenv" \
              --with-decryption --query Parameter.Value --output text | cat > .env.new || true
            [ -s .env.new ] && break
            sleep 5
          done
          # Piped through cat: the aws-cli snap writes nothing when stdout is redirected
          # straight to a file. Never replace a working .env with an empty one.
          [ -s .env.new ] || { echo "Could not read /agroconnect/$ENVIRONMENT/dotenv from SSM"; exit 1; }
          mv .env.new .env
          chown deploy:deploy .env docker-compose.yml
          chmod 600 .env

          registry="${IMAGE_PREFIX%%/*}"
          /snap/bin/aws ecr get-login-password --region "$AWS_REGION" | docker login "$registry" -u AWS --password-stdin >/dev/null

          previous=$(cat .current_tag 2>/dev/null || true)
          echo "Deploying $IMAGE_TAG (previous: ${previous:-none}) services: $SERVICES"

          export IMAGE_TAG IMAGE_PREFIX
          docker compose pull $SERVICES
          # No service list: also starts services enabled by COMPOSE_PROFILES (staging's database).
          docker compose up -d --remove-orphans

          healthy=false
          if echo "$SERVICES" | grep -qw backend; then
            for i in $(seq 1 40); do
              if curl -fsS "$HEALTHCHECK_URL" >/dev/null; then healthy=true; break; fi
              sleep 3
            done
          else
            healthy=true
          fi

          if [ "$healthy" != true ]; then
            echo "Health check failed at $HEALTHCHECK_URL"
            curl -sS "$HEALTHCHECK_URL" || true
            docker compose logs --tail=100 $SERVICES || true
            if [ -n "$previous" ]; then
              echo "Rolling back to $previous"
              IMAGE_TAG="$previous" docker compose up -d $SERVICES
            fi
            docker logout "$registry" >/dev/null || true
            exit 1
          fi

          echo "$IMAGE_TAG" > .current_tag
          docker image prune -f >/dev/null
          docker logout "$registry" >/dev/null || true
          echo "Deployed $IMAGE_TAG"
          REMOTE
          } > deploy-script.sh

          jq -n --arg b64 "$(base64 -w0 deploy-script.sh)" \
            '{commands: ["umask 077; f=$(mktemp); echo \($b64) | base64 -d > \"$f\"; bash \"$f\"; rc=$?; rm -f \"$f\"; exit $rc"], executionTimeout: ["900"]}' > params.json
          rm deploy-script.sh

          # One server at a time, so the others keep serving while each one restarts.
          for id in $INSTANCE_IDS; do
            cmd=$(aws ssm send-command --instance-ids "$id" --document-name AWS-RunShellScript \
              --parameters file://params.json --comment "deploy $IMAGE_TAG" \
              --query Command.CommandId --output text)
            echo "SSM command $cmd on $id"

            status=Pending
            for _ in $(seq 1 200); do
              sleep 5
              status=$(aws ssm get-command-invocation --command-id "$cmd" --instance-id "$id" \
                --query Status --output text 2>/dev/null || echo Pending)
              case "$status" in Pending|InProgress|Delayed) ;; *) break ;; esac
            done

            aws ssm get-command-invocation --command-id "$cmd" --instance-id "$id" \
              --query '[StandardOutputContent, StandardErrorContent]' --output text
            if [ "$status" != Success ]; then
              rm -f params.json
              echo "::error::Roll-out on $id finished with status $status"
              exit 1
            fi
          done
          rm params.json

          # Servers that Auto Scaling starts later boot this same version.
          aws ssm put-parameter --name "/agroconnect/$ENVIRONMENT/image_tag" --value "$IMAGE_TAG" \
            --type String --overwrite >/dev/null

      - name: Summary
        run: |
          {
            echo "### Deployed to \`${{ needs.setup.outputs.environment }}\`"
            echo "- Image tag: \`${{ needs.setup.outputs.image_tag }}\`"
            echo "- Services: ${{ needs.setup.outputs.services }}"
            echo "- Commit: ${{ github.sha }}"
          } >> "$GITHUB_STEP_SUMMARY"
