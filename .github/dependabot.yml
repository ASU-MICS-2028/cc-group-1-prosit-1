# Weekly dependency update PRs (they go through CI like any other PR).
# The nuget entry takes effect once backend/ has a .csproj.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: development
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /frontend
    target-branch: development
    schedule:
      interval: weekly
    groups:
      minor-and-patch:
        update-types: [minor, patch]
  - package-ecosystem: nuget
    directory: /backend
    target-branch: development
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /frontend
    target-branch: development
    schedule:
      interval: weekly
