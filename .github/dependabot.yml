# Weekly dependency updates, batched: at most one PR per ecosystem each Monday,
# with every update for that ecosystem (major, minor and patch) grouped into it.
# The nuget entry takes effect once backend/ has a .csproj.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    target-branch: development
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 1
    groups:
      github-actions:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /frontend
    target-branch: development
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 1
    groups:
      frontend-npm:
        patterns: ["*"]

  - package-ecosystem: nuget
    directory: /backend
    target-branch: development
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 1
    groups:
      backend-nuget:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /frontend
    target-branch: development
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 1
    groups:
      frontend-docker:
        patterns: ["*"]
