# Local checks that run on every `git commit`.
# One-time setup:  pip install pre-commit && pre-commit install
# Run on all files: pre-commit run --all-files
#
# CI runs the same hooks, so skipping them locally (--no-verify) only
# moves the failure to your PR. Unit tests are NOT run here — CI does that.

repos:
  # Block secrets (AWS keys, tokens, private keys) before they reach a public repo
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  # General file hygiene
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
        exclude: ^frontend/tsconfig.*\.json$   # tsconfig files allow comments
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: detect-private-key
      - id: no-commit-to-branch
        args: [--branch, main, --branch, staging, --branch, development]

  # Frontend (React): same lint + format rules as CI. These need
  # `npm ci` in frontend/ first; CI runs them in the frontend job instead.
  - repo: local
    hooks:
      - id: eslint
        name: eslint (frontend)
        entry: bash -c 'cd frontend && npx --no-install eslint --max-warnings 0 --no-warn-ignored "${@#frontend/}"' --
        language: system
        files: ^frontend/.*\.(ts|tsx|js)$
      - id: prettier
        name: prettier (frontend)
        entry: bash -c 'cd frontend && npx --no-install prettier --write "${@#frontend/}"' --
        language: system
        files: ^frontend/.*\.(ts|tsx|js|css|json|html)$
        exclude: ^frontend/(package-lock\.json|public/)

  # Backend (ASP.NET Core): `dotnet format` hook is added with the backend/ folder.
