# Local checks that run on every `git commit`.
# One-time setup:  pip install pre-commit && pre-commit install
# Run on all files: pre-commit run --all-files
#
# CI runs the same hooks, so skipping them locally (--no-verify) only
# moves the failure to your PR. Unit tests are NOT run here — CI does that.

repos:
  # Block secrets (AWS keys, tokens, private keys) before they reach a public repo
  - repo: https://github.com/gitleaks/gitleaks
    rev: v8.30.1
    hooks:
      - id: gitleaks

  # General file hygiene
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-json
      - id: check-merge-conflict
      - id: check-added-large-files
        args: [--maxkb=1024]
      - id: detect-private-key
      - id: no-commit-to-branch
        args: [--branch, main, --branch, staging, --branch, development]

  # Backend (FastAPI): same lint + format rules as CI
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.16.10
    hooks:
      - id: ruff-check
        args: [--fix]
        files: ^backend/
      - id: ruff-format
        files: ^backend/

  # Frontend (React): ESLint/Prettier hooks will be added once frontend/ exists.
