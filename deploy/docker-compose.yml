# Production/staging stack, run on each EC2 instance from /opt/agroconnect.
# The deploy workflow copies this file over and sets IMAGE_TAG / IMAGE_PREFIX.
# App config and secrets (DB connection, bucket, ...) live in
# /opt/agroconnect/.env on the server. The deploy workflow writes that file from
# SSM Parameter Store (/agroconnect/<env>/dotenv, managed by Terraform); it is
# never committed.
#
# Backend: ASP.NET Core listens on 8080 inside the container (the .NET default
# for containers). Frontend: nginx-unprivileged listens on 8080 and proxies
# /api to the backend over the compose network.

services:
  backend:
    image: ${IMAGE_PREFIX}/backend:${IMAGE_TAG}
    restart: unless-stopped
    env_file: .env
    ports:
      - "127.0.0.1:8000:8080"   # host port 8000 is used by the deploy health check only
    healthcheck:
      # The Debian-based aspnet image has bash but no curl or wget
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /health HTTP/1.0\r\n\r\n' >&3 && head -n1 <&3 | grep -q ' 200 '"]
      interval: 30s
      timeout: 5s
      retries: 3

  frontend:
    image: ${IMAGE_PREFIX}/frontend:${IMAGE_TAG}
    restart: unless-stopped
    env_file: .env
    ports:
      - "80:${FRONTEND_PORT:-8080}"

  # Staging only: PostgreSQL in a container (production uses RDS). Enabled by
  # COMPOSE_PROFILES=localdb in staging's .env; not reachable from outside.
  db:
    image: postgres:17-alpine
    profiles: ["localdb"]
    restart: unless-stopped
    env_file: .env
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      timeout: 3s
      retries: 10

volumes:
  db-data:
